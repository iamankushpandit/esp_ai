name: Pages

# Generates the site and publishes it to GitHub Pages on every push to main.
#
# The page is DERIVED -- tools/gen_site.py reads the measured figures out of
# README.md, docs/STAGE_E_RESULTS.md and docs/GGUF.md, and tools/gen_demo_gifs.py
# renders the per-version recordings from the transcripts in gen_site.py. So
# the deploy has to run the generators rather than serve a checked-in file:
# a hand-updated copy of a measurement is one that will be wrong and cannot
# say so, and this project's whole argument is that its numbers are real.
#
# The generated page is also committed under docs/, and a pull request checks
# the two agree, so a reader of the repository sees what a visitor sees.
#
# The deploy publishes the artifact at the site root, and publishes the same
# page again under /docs/ -- see "Keep the /docs/ URL alive" below for why.
#
# Enabling: `configure-pages` with enablement below turns Pages on for the
# repository the first time this runs, so it does not need a visit to
# Settings -> Pages. It is allowed to fail, because the API refuses when the
# repository's default workflow permissions are read-only -- and that must not
# cost us the run. The deploy job is the honest test of whether Pages is on.

on:
  push:
    branches: [main]
  pull_request:          # generate on PRs too -- see the note on the build job
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Pillow is only needed for the GIFs. Seconds to install.
      - name: Install Pillow
        run: pip install pillow

      # This step is deliberately NOT gated on which files changed, and it runs
      # on pull requests as well as pushes. The changes most likely to break
      # the page are exactly the ones a source-file gate would skip: a renamed
      # placeholder, a retitled table in the README, a heading that moved. Every
      # extractor in gen_site.py fails loudly when its source stops matching,
      # so this step is the check as much as it is the build -- and a red pull
      # request is a much cheaper place to find out than a live page.
      - name: Generate the site
        run: |
          python tools/gen_demo_gifs.py --out site/assets
          python tools/gen_site.py --out _site \
            --repo "${{ github.server_url }}/${{ github.repository }}"

      # The committed copy under docs/ must match what the generators produce.
      # If it does not, someone edited the generated page by hand -- which is
      # the one thing the header of every generated file asks them not to do,
      # because the next run silently throws the edit away.
      #
      # The footer's build date is the exception, and is normalised away on
      # both sides before the diff. It comes from the last commit (see
      # built_date in tools/gen_site.py), and on a pull request the checkout
      # is GitHub's merge commit -- dated when that ref was last recomputed,
      # not when the author ran the generator. main moving underneath a branch
      # is enough to change it, so the line drifts with no edit behind it and
      # turns a green pull request red on its own. It is generated from git
      # rather than written by hand, so there is no hand edit for the
      # normalisation to hide. Every other line is still compared exactly.
      - name: docs/ must match the generators
        if: github.event_name == 'pull_request'
        run: |
          undate() {
            sed -E 's/(Built from [^,]*, )[0-9]{4}-[0-9]{2}-[0-9]{2}/\1DATE/' "$1"
          }
          undate _site/index.html > "$RUNNER_TEMP/generated.html"
          undate docs/index.html > "$RUNNER_TEMP/committed.html"
          if ! diff -q "$RUNNER_TEMP/committed.html" \
                       "$RUNNER_TEMP/generated.html" >/dev/null 2>&1; then
            echo "::error::docs/index.html is not what tools/gen_site.py produces."
            echo "Run: python tools/gen_demo_gifs.py && python tools/gen_site.py --out docs"
            diff -u "$RUNNER_TEMP/committed.html" \
                    "$RUNNER_TEMP/generated.html" | head -40 || true
            exit 1
          fi
          echo "docs/index.html matches."

      - name: Every file we wrote carries its licence notice
        run: python tools/check_licenses.py

      # /esp_ai/docs/ has to keep working. Until this workflow's deploy first
      # succeeded, Pages served this repository's branch, where Jekyll put the
      # committed docs/index.html at /docs/ and the README at the root. The
      # artifact deploy moved the page to the root and took /docs/ with it --
      # and that URL is already out in the world, on a CV among other places.
      # A link a stranger has is not ours to break, so the page ships at both
      # paths. It is one file and its assets; the duplication costs less than
      # a 404 on a link someone was given.
      - name: Keep the /docs/ URL alive
        run: |
          mkdir -p _site/docs
          cp _site/index.html _site/docs/index.html
          cp -r _site/assets _site/docs/assets

      - name: Report the page size
        run: |
          {
            echo '### Site'
            echo
            echo '| File | Bytes |'
            echo '|---|---:|'
            printf '| index.html | %s |\n' "$(stat -c%s _site/index.html)"
            for f in _site/assets/*; do
              printf '| %s | %s |\n' "assets/$(basename "$f")" "$(stat -c%s "$f")"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
